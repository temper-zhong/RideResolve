[project]
name = "rideresolve"
version = "0.1.0"
description = "Evidence-grounded multi-agent ride-hailing dispute resolution prototype"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.10,<3",
]

[project.scripts]
rideresolve-tools = "rideresolve.tool_api:main"

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
